base_config: configs/base.yaml

evaluation:
  seed_start: 20000
  episodes_per_task: 5
  max_retries: 1
  save_video: true
  keep_failures: true
  # Primary award benchmark: 20 L1 tasks. Run advanced explicitly for L2–L4.
  suite: basic
  tasks: null

interrupt:
  enabled: true
  demo_on_first_episode: true

metrics:
  - task_success_rate
  - object_accuracy
  - target_accuracy
  - first_attempt_success
  - final_success
  - recovery_success
  - completion_time
  - inference_latency
  - simulation_throughput
  - peak_vram
  - safe_interrupt_rate
  - interrupt_response_steps
  - success_by_scenario
